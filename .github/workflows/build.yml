name: Build Injector App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install dpkg ldid
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip-components=1

      - name: Build tweak .deb
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          cd tweak
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p ../output
          cp packages/*.deb ../output/ 2>/dev/null || true

      - name: Upload tweak deb
        uses: actions/upload-artifact@v4
        with:
          name: StandoffWH-deb
          path: output/*.deb
          retention-days: 30
