name: Build WHApp TIPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build WHApp (unsigned)
        run: |
          xcodebuild \
            -project WHApp/WHApp.xcodeproj \
            -scheme WHApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.onyx.whapp \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            build

      - name: Package as .tipa
        run: |
          APP_PATH=$(find build -name "WHApp.app" -maxdepth 2 | head -1)
          echo "Found app at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/WHApp.app

          # sign with ldid + entitlements
          brew install ldid
          ldid -SWHApp/WHApp/Entitlements.plist Payload/WHApp.app/WHApp

          zip -r WHApp.ipa Payload
          mv WHApp.ipa WHApp.tipa

          mkdir -p output
          cp WHApp.tipa output/

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: WHApp-tipa
          path: output/WHApp.tipa
          retention-days: 30
