name: Build WHApp TIPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Theos
        run: |
          brew install dpkg make ldid-procursus
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip-components=1

      - name: Build StandoffWH.dylib
        run: |
          # clone tweak repo and build just the dylib
          git clone https://github.com/wxklyy/StandoffWH.git /tmp/StandoffWH
          cd /tmp/StandoffWH

          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

          # find the compiled dylib (exclude .dSYM debug symbols!)
          DYLIB=$(find .theos -type f -name "StandoffWH.dylib" ! -path "*.dSYM*" | head -1)
          echo "Selected Dylib: $DYLIB"
          file "$DYLIB"
          cp "$DYLIB" $GITHUB_WORKSPACE/WHApp/WHApp/StandoffWH.dylib

      - name: Build WHApp (unsigned)
        run: |
          xcodebuild \
            -project WHApp/WHApp.xcodeproj \
            -scheme WHApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.onyx.whapp \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            OTHER_LDFLAGS="-Wl,-ld_classic" \
            build

      - name: Package as .tipa
        run: |
          APP_PATH=$(find build -name "WHApp.app" -maxdepth 2 | head -1)
          echo "App: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/WHApp.app

          # clean up code signature and dSYM leftovers
          rm -rf Payload/WHApp.app/_CodeSignature
          rm -rf Payload/WHApp.app/*.dSYM

          # copy dylib into app bundle
          mkdir -p Payload/WHApp.app/Frameworks
          if [ -f WHApp/WHApp/StandoffWH.dylib ]; then
            echo "Copying StandoffWH.dylib into bundle..."
            file WHApp/WHApp/StandoffWH.dylib
            cp WHApp/WHApp/StandoffWH.dylib Payload/WHApp.app/StandoffWH.dylib
            cp WHApp/WHApp/StandoffWH.dylib Payload/WHApp.app/Frameworks/StandoffWH.dylib
          fi

          # sign main executable with TrollStore entitlements
          ldid -SWHApp/WHApp/Entitlements.plist Payload/WHApp.app/WHApp

          zip -r WHApp.ipa Payload
          mv WHApp.ipa WHApp.tipa

          mkdir -p output
          cp WHApp.tipa output/

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: WHApp-tipa
          path: output/WHApp.tipa
          retention-days: 30
