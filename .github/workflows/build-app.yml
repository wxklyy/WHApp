name: Build WHApp TIPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build WHApp (unsigned)
        run: |
          cd injector/WHApp

          xcodebuild \
            -project WHApp.xcodeproj \
            -scheme WHApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.onyx.whapp \
            BUILD_DIR=./build \
            build

      - name: Package as .ipa and sign with ldid
        run: |
          cd injector/WHApp
          APP_PATH=$(find build -name "WHApp.app" | head -1)
          echo "App path: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/WHApp.app

          # sign with ldid using our entitlements
          brew install ldid
          ldid -SWHApp/Entitlements.plist Payload/WHApp.app/WHApp

          # pack as ipa
          zip -r WHApp.ipa Payload

          # rename to .tipa for TrollStore
          cp WHApp.ipa WHApp.tipa

          mkdir -p ../../output
          cp WHApp.tipa ../../output/

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: WHApp-tipa
          path: output/WHApp.tipa
          retention-days: 30
